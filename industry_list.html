<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產業資訊 | 日將事業有限公司</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root { --brand-blue: #007FFF; }
        
        /* 仿新聞列表區塊樣式 */
        .news-item {
            background-color: #f8f9fa; /* 淺灰色背景 */
            border-bottom: 5px solid #fff; /* 用白色條紋做間隔 */
            transition: all 0.3s;
            cursor: pointer; /* 讓整個區塊看起來可點擊 */
            text-decoration: none !important; /* 移除超連結下底線 */
            display: block; /* 讓整個 <a> 標籤撐開 */
        }
        
        .news-item:hover {
            background-color: #e9ecef; /* 滑鼠移上去變深一點 */
            transform: translateX(5px); /* 輕微右移增加互動感 */
        }

        .news-image-container {
            width: 150px; /* 固定圖片容器寬度 */
            height: 100px; /* 固定圖片容器高度 */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eee; /* 圖片未載入時的背景 */
        }

        .news-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保圖片填滿且不變形 */
        }

        .news-title {
            color: #000 !important; /* 標題全黑 */
            font-weight: bold;
            font-size: 1.25rem;
            margin-bottom: 5px;
        }

        .news-summary {
            color: #666 !important; /* 摘要深灰色 */
            font-size: 1rem;
            line-height: 1.5;
            /* 限制摘要只顯示兩行，多出的顯示省略號 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    
    <div class="container mt-5 mb-5">
        <h2 class="fw-bold mb-4">產業資訊 Industry Insights</h2>
        <hr class="mb-5">

        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <a href="article_001.html" class="news-item shadow-sm">
                    <div class="d-flex align-items-center p-3">
                        <div class="news-image-container me-4 border">
                            <img src="static/industry_001.jpg" alt="統一與銻供應鏈" onerror="this.onerror=null; this.src='./static/logo.jpeg';">
                        </div>
                        
                        <div class="flex-grow-1">
                            <div class="news-title">統一為何想擺脫家樂福授權？其實和三氧化二銻供應鏈問題很像</div>
                            <div class="news-summary">
                                探討品牌經營自主權的重要性，並延伸至中國銻礦出口管制對阻燃材料市場的深度影響。
                            </div>
                        </div>
                    </div>
                </a>

                </div>
        </div>

        <div class="mt-5 text-center">
            <a href="index.html" class="btn btn-outline-secondary">← 返回首頁</a>
        </div>
    </div>

    </body>
</html>
