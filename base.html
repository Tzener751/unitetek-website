<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>日將事業 UNITETEK</title>
    <!-- 使用 ./ 確保從當前根目錄尋找 static 資料夾 -->
    <link rel="icon" type="image/jpeg" href="./static/logo.jpeg?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    :root { 
        --brand-blue: #007FFF; 
    }

    /* 1. 導覽列連結預設樣式 - 調大字體 */
    .main-nav .nav-link { 
        color: var(--brand-blue) !important; 
        font-weight: 600;
        font-size: 1.25rem; /* 👈 新增：調整字體大小，1.25rem 約等於 20px */
        padding: 10px 20px; /* 👈 稍微加大內邊距，配合大字體 */
        border-radius: 4px;
        transition: all 0.2s; 
    }

    /* 2. 點擊時或選中時背景轉灰色 */
    .main-nav .nav-link:active, 
    .main-nav .nav-link:focus {
        background-color: #e9ecef !important;
        color: var(--brand-blue) !important;
    }

    /* 3. 滑鼠滑過效果 */
    .main-nav .nav-link:hover {
        background-color: #f8f9fa;
        transform: translateY(-1px); /* 👈 讓它有一點浮動感，更好看 */
    }

    /* 其餘樣式保持不變... */
    .text-brand-blue { color: var(--brand-blue) !important; }
    </style>
</head>
<body>
    <!-- 這裡放你的導覽列代碼 -->
    <nav class="navbar navbar-expand-lg main-nav bg-white shadow-sm">
        <div class="container">
            <!-- 請確保你的代碼長這樣 -->
            <a class="navbar-brand d-flex align-items-center" href="/">
                <!-- Logo 圖片 -->
                <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Logo" style="height:80px;">
                
                <!-- 文字籃子：加入 text-start 確保強制左對齊 -->
                <div class="ms-2 d-flex flex-column align-items-start">
                <!-- 中文：維持品牌藍與粗體 -->
                <div style="font-size: 1.7rem; line-height: 1.1; color: var(--brand-blue); font-weight: bold;">
                    日將事業有限公司
                </div>
                
                <!-- 英文：現在也改為品牌藍 -->
                <div style="font-size: 1.0rem; line-height: 1.1; letter-spacing: 0.5px; color: var(--brand-blue); margin-top: 2px; position: relative; left: 4px; font-weight: bold;">
                    UNITETEK INTERNATIONAL CO., LTD.
                </div>

                <!-- 關鍵字：維持黑色以利閱讀區隔 -->
                <div style="font-size: 0.9rem; color: #000; line-height: 1.1; margin-top: 4px; position: relative; left: 4px;">
                    無鹵阻燃劑 | 鹵素阻燃協效劑 | VGCF碳管 | 氮化鋁粉 | 熱電材料
                </div>
            </div>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/about">關於日將</a></li>
                    <!-- <li class="nav-item"><a class="nav-link" href="/products">產品介紹</a></li> -->
                    <li class="nav-item"><a class="nav-link" href="/contact">聯絡我們</a></li>
                    <li class="nav-item"><a class="nav-link" href="/news">產業資訊</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 關鍵：預留位置給每個頁面的獨特內容 -->
    {% block content %}{% endblock %}

    <!-- 頁尾版權資訊 -->
    <footer class="py-4 bg-white border-top">
        <div class="container text-center">
            <p class="mb-0 fw-bold text-secondary" style="font-size: 1.5rem; letter-spacing: 0.5px;">
                Copyright © 2026 日將事業有限公司 UNITETEK INTERNATIONAL CO., LTD. 保留所有權利.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
